name: CI/CD Pipeline - Real-time fMRI AI Analysis

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run daily at 6 AM UTC
    - cron: '0 6 * * *'

jobs:
  # Core functionality tests (always run)
  test-core:
    name: Core fMRI Analysis Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']
        
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install core dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy scipy matplotlib pandas
        pip install nibabel nilearn
        pip install networkx scikit-learn
    
    - name: Run core fMRI analysis tests
      run: |
        python tests/test_core_fmri_analysis.py
      env:
        PYTHONPATH: ${{ github.workspace }}/python
    
    - name: Upload core test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: core-test-results-${{ matrix.os }}-py${{ matrix.python-version }}
        path: reports/

  # Optional AI models tests (can fail without breaking CI)
  test-ai-models:
    name: AI Models Tests (Optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install AI dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy scipy matplotlib pandas
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        pip install scikit-learn
    
    - name: Run AI models tests
      run: |
        python tests/test_ai_models.py
      env:
        PYTHONPATH: ${{ github.workspace }}/python
    
    - name: Upload AI test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: ai-test-results-py${{ matrix.python-version }}
        path: reports/

  # GPU acceleration tests (Linux only, can fail)
  test-gpu-acceleration:
    name: GPU Acceleration Tests (Optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install OpenCL dependencies (Ubuntu)
      run: |
        sudo apt-get update
        sudo apt-get install -y ocl-icd-opencl-dev opencl-headers clinfo
        # Install CPU-only OpenCL driver for testing
        sudo apt-get install -y intel-opencl-icd
    
    - name: Install GPU dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy scipy matplotlib
        pip install pyopencl
    
    - name: Build C++ GPU components
      run: |
        mkdir -p build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release
        make -j2
      continue-on-error: true
    
    - name: Run GPU acceleration tests
      run: |
        python tests/test_gpu_acceleration.py
      env:
        PYTHONPATH: ${{ github.workspace }}/python
    
    - name: Upload GPU test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: gpu-test-results
        path: reports/

  # Comprehensive test suite
  test-comprehensive:
    name: Comprehensive Test Suite
    runs-on: ubuntu-latest
    needs: [test-core]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install comprehensive dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      continue-on-error: true
    
    - name: Run comprehensive test suite
      run: |
        python tests/run_all_tests.py
      env:
        PYTHONPATH: ${{ github.workspace }}/python
    
    - name: Upload comprehensive test report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: comprehensive-test-report
        path: reports/test_report.json

  # Code quality checks
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install quality tools
      run: |
        python -m pip install --upgrade pip
        pip install black flake8 mypy pylint
        pip install numpy scipy  # For type checking
    
    - name: Check code formatting with Black
      run: |
        black --check --diff python/ tests/ examples/
      continue-on-error: true
    
    - name: Lint with flake8
      run: |
        flake8 python/ tests/ examples/ --max-line-length=88 --extend-ignore=E203,W503
      continue-on-error: true
    
    - name: Type checking with mypy
      run: |
        mypy python/ --ignore-missing-imports
      continue-on-error: true

  # Documentation checks
  docs-check:
    name: Documentation Check
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Check README and documentation
      run: |
        # Check that key documentation files exist
        ls -la README.md PROJECT_ARCHITECTURE.md PROGRESS_LOG.md
        
        # Check for documentation completeness
        grep -q "Installation" README.md
        grep -q "Usage" README.md
        grep -q "Architecture" PROJECT_ARCHITECTURE.md
        
        echo "✅ Documentation check passed"

  # Performance benchmarks (optional)
  performance-benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    continue-on-error: true
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install benchmark dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy scipy matplotlib pandas
        pip install nibabel nilearn networkx
    
    - name: Run performance benchmarks
      run: |
        python examples/performance_benchmark.py
      env:
        PYTHONPATH: ${{ github.workspace }}/python
      continue-on-error: true

  # Generate release artifacts on successful tests
  build-artifacts:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    needs: [test-core, test-comprehensive]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch full history for version tagging
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build twine wheel setuptools
    
    - name: Build package
      run: |
        python -m build
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: python-package
        path: dist/

  # Deployment to PyPI (on releases)
  deploy-pypi:
    name: Deploy to PyPI
    runs-on: ubuntu-latest
    needs: [build-artifacts]
    if: github.event_name == 'release' && github.event.action == 'published'
    environment: pypi
    
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: python-package
        path: dist/
    
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        repository-url: https://upload.pypi.org/legacy/

# Workflow status notifications
  notify-status:
    name: Notify Status
    runs-on: ubuntu-latest
    needs: [test-core, test-ai-models, test-gpu-acceleration, test-comprehensive, code-quality]
    if: always()
    
    steps:
    - name: Report Overall Status
      run: |
        echo "🚀 CI/CD Pipeline Results:"
        echo "Core Tests: ${{ needs.test-core.result }}"
        echo "AI Models Tests: ${{ needs.test-ai-models.result }}"  
        echo "GPU Tests: ${{ needs.test-gpu-acceleration.result }}"
        echo "Comprehensive Tests: ${{ needs.test-comprehensive.result }}"
        echo "Code Quality: ${{ needs.code-quality.result }}"
        
        # Core tests must pass for success
        if [[ "${{ needs.test-core.result }}" == "success" && "${{ needs.test-comprehensive.result }}" == "success" ]]; then
          echo "✅ Pipeline successful - Core functionality verified"
          exit 0
        else
          echo "❌ Pipeline failed - Core functionality issues detected"
          exit 1
        fi 